name: Bug
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, commands, URLs, block numbers or transaction hashes.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Version / commit, browser or OS, logs (redact secrets, hosts and IPs).
